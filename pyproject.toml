[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "luckypass"
version = "0.1.0"
description = "A CLI tool for auditing password strength"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "benk222"}
]

[project.scripts]
luckypass = "luckypass.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["luckypass*"]
exclude = ["data*", "tests*"]